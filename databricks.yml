bundle:
  name: global-news-intelligence-lakehouse

resources:
  jobs:
    gdelt_news_intelligence_pipeline:
      name: gdelt-news-intelligence-pipeline-bundle

      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/01_gdelt_bronze_ingestion.ipynb

        - task_key: silver_validation
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/02_gdelt_silver_validation.ipynb

        - task_key: gold_refined
          depends_on:
            - task_key: silver_validation
          notebook_task:
            notebook_path: ./notebooks/03_gdelt_gold_refinedData.ipynb

        - task_key: gold_features
          depends_on:
            - task_key: gold_refined
          notebook_task:
            notebook_path: "./notebooks/03_gdelt_gold_features(acc to gpt).ipynb"

        - task_key: anomaly_model
          depends_on:
            - task_key: gold_features
          notebook_task:
            notebook_path: "./notebooks/04_gdelt_anomaly_model (1).ipynb"

targets:
  dev:
    mode: development
    default: true